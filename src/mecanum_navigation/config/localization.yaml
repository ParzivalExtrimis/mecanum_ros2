# Global localization with AMCL on the 2D lidar (docs/plan.md Phase 6, the default).
# Started by launch/localization.launch.py with localization:=amcl. Built from the upstream
# nav2_bringup/params/nav2_params.yaml (Nav2 1.3.13); every changed value says why.
#
#   /scan + /map + TF odom -> base_footprint (the EKF) --amcl--> TF map -> odom
#
# AMCL is then the only publisher of map -> odom; with localization:=slam_toolbox it is not
# started (test/test_nav2_config.py checks both modes).

map_server:
  ros__parameters:
    topic_name: "map"
    frame_id: "map"
    # yaml_filename: set by the launch file (maps/restroom.yaml by default)

amcl:
  ros__parameters:
    # Mecanum: the omnidirectional motion model (upstream DifferentialMotionModel). alpha5 is
    # the translation noise of the strafe direction, used only by this model.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # Odometry noise, upstream 0.2 each. The EKF's odometry stays within 1 cm over the 29 m
    # mapping route (Phase 5); at 0.2 the particles spread so fast that the estimate drifted
    # 10 to 13 cm where the 2D lidar sees little (the lobby, facing the open corridor).
    # STAND-IN: set from the real base's measured odometry error (steppers, no encoders).
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    # The 2D lidar's range (mecanum.gazebo.xacro: 0.05..12 m; upstream 100 / -1).
    laser_max_range: 12.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    # 120 beams, one per 3 deg (upstream 60): more of the restroom's short walls per update.
    # STAND-IN.
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    # Upstream 0.2 / 0.5 / 0.5: with a 0.2 m spread the likelihood is nearly flat within
    # +-10 cm, and the estimate drifted 8 to 15 cm in the restroom (Phase 6 suite). 0.05 m is
    # one map cell; z_rand 0.2 still tolerates what the map leaves out (stall partitions, the
    # glass screen, people). STAND-IN: set from the real lidar's noise and real maps.
    sigma_hit: 0.05
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0
    # Filter updates. Upstream 0.25 m / 0.2 rad; smaller, so that the pose is corrected more
    # often near the doorway. STAND-IN.
    update_min_a: 0.1
    update_min_d: 0.1
    # The map frame is the robot's spawn pose (Phase 5), which is home: start there.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
