# rko_lio (online_node) on the REAL L2 (phase 4H). Same as rko_lio.yaml (simulation) except
# where the hardware differs; keep the two in step.
#
# Started by mecanum_bringup hardware_sensors.launch.py lio:=true, through
# launch/lio.launch.py, which remaps rko_lio's /tf to /lio/tf_unused. Extrinsics come from TF.
rko_lio:
  ros__parameters:
    imu_topic: /l2/imu
    lidar_topic: /l2/points_filtered
    base_frame: base_footprint
    odom_frame: lio_odom
    odom_topic: /lio/raw_odom

    # The real L2 sweeps over ~180 ms, so points are deskewed with the driver's per-point
    # `time` field: float32 seconds after header.stamp, which the SDK sets to the start of the
    # cloud. rko_lio finds the field by name (t/time/timestamp/timestamps/stamps); the field is
    # relative and already in seconds, so say so instead of relying on its heuristic.
    deskew: true
    lidar_timestamps:
      force_relative: true
      multiplier_to_seconds: 1.0
    # Estimate the IMU bias and gravity direction from the IMU samples between the first two
    # scans. The robot MUST stand still when LIO starts.
    initialization_phase: true

    min_range: 0.3     # STAND-IN: indoor guess; the self-filter already removes the robot
    max_range: 30.0    # STAND-IN: the L2's specified range; lower it if far returns are noisy
    voxel_size: 0.25   # STAND-IN: indoor map resolution guess (upstream default 1.0 is outdoor)
    max_correspondence_distance: 0.5
    max_num_threads: 1
    reset_on_registration_error: false

    publish_local_map: false
    publish_deskewed_scan: false
