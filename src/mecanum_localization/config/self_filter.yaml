# Robot self-filter (pcl_ros CropBox, negative): removes L2 returns that fall on the robot.
#
# The box is defined in base_footprint (z = 0 on the floor) and must cover the whole robot,
# including every mount and sensor the L2 can see. Everything inside it is dropped; the cloud is
# published back in l2_lidar so the LIO sees sensor-frame points.
#
# This is the single place to replace with a URDF-based self-filter once the arm is mounted
# (an arm moves through this box and outside it).
self_filter:
  ros__parameters:
    input_frame: base_footprint
    output_frame: l2_lidar
    negative: true          # keep points OUTSIDE the box
    keep_organized: false
    # REWRITE: the previous model's box was removed (see REWRITE.md). Until it is set again,
    # pcl_ros uses its built-in default, a +-1 m cube around base_footprint, which matches no
    # robot. Set it from the new URDF: the chassis and wheel extent plus a margin, and z from
    # below the floor to above the highest part of the robot.
