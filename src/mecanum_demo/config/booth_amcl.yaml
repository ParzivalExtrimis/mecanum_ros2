# AMCL tuning for the booth demo, applied on top of mecanum_navigation/config/localization.yaml
# by localization.launch.py amcl_params:=... (demo_sim.launch.py passes it; the SBC launch will
# too). The booth is small and the demo stops often:
#   - every beam and a sharper likelihood field (the C1 sees only the front half);
#   - updates after 2 cm or 3 degrees, so the estimate keeps up between the short segments.
# STAND-IN: re-check on the real booth, where the C1's noise and the wheel slip differ.
amcl:
  ros__parameters:
    max_beams: 250
    sigma_hit: 0.02
    z_hit: 0.95
    z_rand: 0.05
    update_min_d: 0.02
    update_min_a: 0.05
