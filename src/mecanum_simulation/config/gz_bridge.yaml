  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /sim/ultrasonic/rear_left
  gz_topic_name: /sim/ultrasonic/rear_left/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /sim/ultrasonic/rear_right
  gz_topic_name: /sim/ultrasonic/rear_right/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /sim/cliff/front_left
  gz_topic_name: /sim/cliff/front_left/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /sim/cliff/front_right
  gz_topic_name: /sim/cliff/front_right/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /sim/cliff/rear_left
  gz_topic_name: /sim/cliff/rear_left/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /sim/cliff/rear_right
  gz_topic_name: /sim/cliff/rear_right/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS

# Plank contacts, input of sim_bumper, which publishes /bumper/*
- ros_topic_name: /sim/bumper/front
  gz_topic_name: /sim/bumper/front
  ros_type_name: ros_gz_interfaces/msg/Contacts
  gz_type_name: gz.msgs.Contacts
  direction: GZ_TO_ROS
- ros_topic_name: /sim/bumper/rear
  gz_topic_name: /sim/bumper/rear
  ros_type_name: ros_gz_interfaces/msg/Contacts
  gz_type_name: gz.msgs.Contacts
  direction: GZ_TO_ROS
